name: release-please

on:
  push:
    branches: [development]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # PRs opened with the default GITHUB_TOKEN are authored by
          # github-actions[bot], and GitHub holds their pull_request CI runs as
          # "action_required" (manual approval) on every release. Authoring the
          # release PR with a PAT (or GitHub App token) from a write-access
          # identity makes CI run automatically and removes that gate. Add the
          # PAT as the RELEASE_PLEASE_TOKEN repo secret (fine-grained: Contents
          # + Pull requests: read/write on this repo). Until it exists this
          # falls back to GITHUB_TOKEN, so releases keep working unchanged (just
          # with the approval prompt).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: development
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  publish:
    name: Build and publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      # `prepublishOnly` builds the self-contained dist/cli.js that `bin` points at.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-mcpb:
    name: Build .mcpb bundle and attach to release
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the server bundle
        run: |
          npm ci
          npm run build:cli

      - name: Stage bundle files
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/server"
          cp manifest.json "$STAGE/manifest.json"
          cp dist/cli.js "$STAGE/server/index.js"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Pack .mcpb
        run: npx --yes @anthropic-ai/mcpb pack "$STAGE" tram-mcp.mcpb

      - name: Verify .mcpb manifest version
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          packed_version=$(unzip -p tram-mcp.mcpb manifest.json | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$packed_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::.mcpb manifest version ($packed_version) does not match release version ($EXPECTED_VERSION)"
            exit 1
          fi
          echo ".mcpb verified at version $packed_version"

      - name: Upload .mcpb to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" tram-mcp.mcpb --repo "$REPO" --clobber

  sync-main:
    name: Open sync PR development to main
    needs: [release-please, publish, build-mcpb]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          existing=$(gh pr list --repo "$REPO" --base main --head development --state open --json number -q '.[0].number' || echo "")
          if [ -n "$existing" ]; then
            echo "Sync PR #$existing already open; enabling auto-merge on it."
            gh pr merge "$existing" --repo "$REPO" --auto --merge
            exit 0
          fi
          pr_url=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head development \
            --title "release: sync $TAG to main" \
            --body "Auto-opened by release-please after publishing $TAG to npm. Auto-merging; main is just a mirror of the published tag. See the release: https://github.com/$REPO/releases/tag/$TAG and the npm page: https://www.npmjs.com/package/tram-mcp/v/$VERSION")
          gh pr merge "$pr_url" --repo "$REPO" --auto --merge
