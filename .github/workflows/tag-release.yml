name: Build and Publish
run-name: "Build and Publish: ${{ github.event.head_commit.message || github.event.pull_request.title }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  tag:
    name: Create version tag
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Get version
        id: version
        run: echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" \
              >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifest.json version matches pyproject.toml
        if: steps.tag_check.outputs.exists == 'false'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest_version=$(python3 -c \
            'import json; print(json.load(open("manifest.json"))["version"])')
          if [ "$manifest_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match pyproject.toml version ($EXPECTED_VERSION)"
            exit 1
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.tag_check.outputs.exists }}

  publish:
    name: Build and publish to PyPI
    needs: tag
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: uv pip install --system --upgrade build twine

      - name: Clean previous builds
        run: rm -rf dist/ build/ *.egg-info

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  build-mcpb:
    name: Build .mcpb bundle
    needs: [tag, publish]
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Stage bundle files
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/tram_mcp"
          cp main.py manifest.json pyproject.toml uv.lock README.md "$STAGE/"
          cp tram_mcp/__init__.py tram_mcp/server.py tram_mcp/_autoupdate.py "$STAGE/tram_mcp/"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Pack .mcpb
        run: |
          npx --yes @anthropic-ai/mcpb pack "$STAGE" testrail_mcp.mcpb

      - name: Verify .mcpb manifest version
        env:
          EXPECTED_VERSION: ${{ needs.tag.outputs.version }}
        run: |
          packed_version=$(unzip -p testrail_mcp.mcpb manifest.json | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          if [ "$packed_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::.mcpb manifest version ($packed_version) does not match release version ($EXPECTED_VERSION)"
            exit 1
          fi
          echo ".mcpb verified at version $packed_version"

      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-bundle
          path: testrail_mcp.mcpb
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [tag, publish, build-mcpb]
    if: needs.tag.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download .mcpb artifact
        uses: actions/download-artifact@v4
        with:
          name: mcpb-bundle

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --latest \
            testrail_mcp.mcpb

  sync-dev:
    name: Sync main back to dev
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git merge main --no-edit
          git push origin dev
