name: CI

# Runs on every push/PR to main and development. This is the project's sole test
# suite now that the Python package is gone, so it is intentionally NOT path-filtered
# — the sync PR (which only touches version files) must still get a CI run.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    name: Cloudflare Worker (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - run: npm ci

      # worker-configuration.d.ts is gitignored and generated from wrangler.jsonc;
      # tsc --noEmit needs it to exist.
      - run: npx wrangler types

      - run: npx tsc --noEmit

      - run: npx vitest run
