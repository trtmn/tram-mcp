name: CI

# Runs on every push/PR to main and development. This is the project's sole test
# suite, so it is intentionally NOT path-filtered — the release sync PR (which
# only touches version files) must still get a CI run.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    name: Type-check & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Run every OS to completion even if one fails, so a single-platform
      # regression doesn't mask the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npx vitest run
