[project]
name = "tram-mcp"
version = "0.6.0"
description = "MCP server exposing TestRail API endpoints as tools for LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Matt Troutman", email = "git@trtmn.com" },
]
keywords = ["mcp", "testrail", "testing", "api", "llm", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=3.3.1,<4",
    "testrail-api-module==0.8.0",
]

[project.urls]
Homepage = "https://github.com/trtmn/tram-mcp"
Repository = "https://github.com/trtmn/tram-mcp"
Issues = "https://github.com/trtmn/tram-mcp/issues"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The launcher (tram_mcp/__init__.py) serves tools_static.json verbatim
# during the window where FastMCP is still importing. Make the include
# explicit so a future hatchling default flip doesn't silently drop it
# from the wheel.
[tool.hatch.build.targets.wheel]
packages = ["tram_mcp"]
include = ["tram_mcp/tools_static.json"]

[tool.hatch.build.targets.sdist]
include = ["tram_mcp", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml", "uv.lock", "main.py", "manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
tram-mcp = "tram_mcp:main"
tram_mcp = "tram_mcp:main"
